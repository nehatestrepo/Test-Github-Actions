name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [dev, qa, demo]
        default: dev
      version:
        description: "AI Vista version to deploy (must match l1.lock)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}
  VERSION: ${{ inputs.version }}

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LABEL }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Get repo files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version is the accepted release
        run: |
          ACCEPTED=$(grep '^l1_release_id:' l1.lock | cut -d'"' -f2)
          if [ "$VERSION" != "$ACCEPTED" ]; then
            echo "::error::$VERSION is not the accepted release ($ACCEPTED in l1.lock)"; exit 1
          fi
          echo "Deploying accepted release $VERSION to $ENVIRONMENT"

      - name: Azure login
        if: ${{ vars.DEMO_MODE != 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: '{"clientId":"${{ vars.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'

      - name: Install the release
        run: |
          if [ "${{ vars.DEMO_MODE }}" = "true" ]; then
            echo "DEMO_MODE: would install $VERSION into $ENVIRONMENT"
            echo "  resource group:   ${{ vars.RESOURCE_GROUP }}"
            echo "  name prefix:      ${{ vars.NAME_PREFIX }}"
            echo "  terraform state:  ${{ vars.TF_STATE_STORAGE }}"
            echo "  from registry:    ${{ vars.OUR_REGISTRY }}"
          else
            echo "::error::Real mode is not built yet (waiting for the install script flags)"; exit 1
          fi

      - name: Health checks
        run: |
          echo "DEMO_MODE: would run the health checks for $ENVIRONMENT"

      - name: Record the installation in the ledger repo
        env:
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
        run: |
          git clone "https://x-access-token:${LEDGER_TOKEN}@github.com/${{ vars.LEDGER_REPO }}.git" ledger
          cd ledger
          jq -n --arg env "$ENVIRONMENT" --arg v "$VERSION" \
                --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg by "${{ github.actor }}" \
                --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                '{environment:$env, version:$v, deployed_at:$at, deployed_by:$by, run:$run}' \
                > "$ENVIRONMENT.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENVIRONMENT.json"
          git commit -m "Record $VERSION deployed to $ENVIRONMENT"
          git push

      - name: Notify the team
        if: ${{ always() }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          MESSAGE="Deploy of AI Vista $VERSION to $ENVIRONMENT: ${{ job.status }}"
          if [ "${{ vars.DEMO_MODE }}" = "true" ]; then
            echo "DEMO_MODE: would send to Teams: $MESSAGE"
          else
            curl -sS -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" "$TEAMS_WEBHOOK_URL"
          fi